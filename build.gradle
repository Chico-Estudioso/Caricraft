plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Cobblemon (solo compileOnly para el adaptador opcional)
    maven {
        name = 'ImpactDev'
        url = 'https://maven.impactdev.net/repository/development/'
        content { includeGroup 'com.cobblemon' }
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
}

// Herramienta de QA visual (solo desarrollo, no va en el JAR).
sourceSets {
    devtools {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
        compileClasspath += sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output
    }
}

loom {
    mods {
        caricraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        // Herramienta de QA visual: nunca se empaqueta en el JAR.
        caricraft_devtools {
            sourceSet sourceSets.devtools
        }
    }

    runs {
        // Clientes de QA automatizados contra `runServer` (ver docs/TESTING.md).
        qaClientA {
            client()
            name = 'QA Client A'
            source sourceSets.devtools
            runDir 'run-qa-a'
            ideConfigGenerated false
            vmArg '-Dcaricraft.qa.role=A'
            programArgs '--username', 'Dev1', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        qaChallenge {
            client()
            name = 'QA Desafio'
            source sourceSets.devtools
            runDir 'run-qa-a'
            ideConfigGenerated false
            vmArg '-Dcaricraft.qa.role=' + (System.getProperty('qaRole') ?: 'C')
            programArgs '--username', 'Dev1', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        qaNewApps {
            client()
            name = 'QA Apps A'
            source sourceSets.devtools
            runDir 'run-qa-a'
            ideConfigGenerated false
            vmArg '-Dcaricraft.qa.role=N'
            programArgs '--username', 'Dev1', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        qaNewAppsPartner {
            client()
            name = 'QA Apps B'
            source sourceSets.devtools
            runDir 'run-qa-b'
            ideConfigGenerated false
            vmArg '-Dcaricraft.qa.role=M'
            programArgs '--username', 'Dev2', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        qaClientB {
            client()
            name = 'QA Client B'
            source sourceSets.devtools
            runDir 'run-qa-b'
            ideConfigGenerated false
            vmArg '-Dcaricraft.qa.role=B'
            programArgs '--username', 'Dev2', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Integración Cobblemon: SOLO en compilación. El core funciona sin Cobblemon.
    modCompileOnly("com.cobblemon:fabric:${project.cobblemon_version}") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"

    // Cobblemon no arranca en el entorno de desarrollo (mappings de Mojang + reflexión de Kotlin).
    // La compatibilidad real se prueba con tools/cobbleverse_server_test.py.

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'fabric_api_version': project.fabric_api_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// QA en producción: el módulo de QA (source set devtools) remapeado a intermediary para usarlo en un
// cliente de producción con Cobblemon real (ver tools/cobblemon_qa.py y docs/TESTING.md). Nunca se publica.
tasks.register('qaDevJar', Jar) {
    from sourceSets.devtools.output
    archiveClassifier = 'qa-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
tasks.register('remapQaJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn 'qaDevJar'
    inputFile = tasks.named('qaDevJar').flatMap { it.archiveFile }
    archiveClassifier = 'qa'
    destinationDirectory = layout.buildDirectory.dir('qa')
    classpath.from(sourceSets.client.compileClasspath)
    classpath.from(sourceSets.main.output, sourceSets.client.output)
}
